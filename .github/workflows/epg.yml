name: Build EPG for Roku

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EPG JSON
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
          EPG_URLS: ${{ vars.EPG_URLS || 'https://iptvx.one/epg/epg.xml.gz' }}
        run: python scripts/build_epg.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
